[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-prompt-shield"
version = "0.1.0"
description = "Scan GitHub issues and PRs for prompt injection patterns targeting AI coding tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "The Foundry", email = "foundry@jeevesbot.io"}
]
keywords = ["security", "github", "prompt-injection", "ai-coding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.28",
    "ruff>=0.3",
]

[project.scripts]
gh-prompt-shield = "gh_prompt_shield.cli:main"

[project.urls]
Homepage = "https://github.com/jeevesbot-io/foundry-20260306-gh-prompt-shield"
Issues = "https://github.com/jeevesbot-io/foundry-20260306-gh-prompt-shield/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
